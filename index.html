<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My saved messages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3eefb;--card:#fffdff;--ink:#3a2f4f;--soft:#7a6c96;--accent:#8b6fd0;--accent-ink:#fff;--tint:#e6dcf7;--line:#d9cdf0;--danger:#b2415f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1e1830;--card:#2a2242;--ink:#efe9fb;--soft:#b3a6d1;--accent:#b7a0f2;--accent-ink:#1e1830;--tint:#3a3058;--line:#4a3f6e;--danger:#f08aa4;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1e1830;--card:#2a2242;--ink:#efe9fb;--soft:#b3a6d1;--accent:#b7a0f2;--accent-ink:#1e1830;--tint:#3a3058;--line:#4a3f6e;--danger:#f08aa4;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;line-height:1.5}
#bar{position:fixed;top:0;left:0;height:4px;width:0;background:var(--accent);z-index:20}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.row{max-width:680px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .sp{flex:1}
.brand{font-family:"Lora",Georgia,serif;font-weight:600;font-size:1.25rem}
button{font:inherit;font-weight:700;cursor:pointer;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 16px;min-height:44px}
button:hover{background:var(--tint)}
button.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.main:hover{filter:brightness(1.07)}
button.danger{color:var(--danger)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{max-width:680px;margin:0 auto;padding:20px 16px 100px}
h1{font-family:"Lora",Georgia,serif;font-weight:600;font-size:clamp(1.7rem,5.5vw,2.3rem);margin:8px 0 6px}
.sub{color:var(--soft);margin:0 0 18px}
input[type=text],input[type=search],textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
textarea{min-height:340px;line-height:1.7;resize:vertical}
label{display:block;font-weight:700;margin:16px 0 6px}
.tabs{display:flex;gap:8px;margin:14px 0 18px}
.tabs button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:12px;cursor:pointer;box-shadow:0 6px 18px rgba(139,111,208,.12)}
.card:hover{background:var(--tint)}
.card h2{font-family:"Lora",Georgia,serif;font-size:1.15rem;margin:0 0 4px;display:flex;justify-content:space-between;gap:10px}
.card .meta{font-size:.85rem;color:var(--soft);margin-bottom:6px}
.card .pre{color:var(--soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.95rem}
.empty{text-align:center;padding:40px 16px;background:var(--card);border:1.5px dashed var(--line);border-radius:20px;color:var(--soft)}
.empty p{margin:0 0 16px}
.letter{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:clamp(22px,5vw,44px);box-shadow:0 10px 30px rgba(139,111,208,.15)}
.letter p{font-family:"Lora",Georgia,serif;font-size:var(--fs,1.15rem);line-height:1.85;margin:0 0 1.2em;max-width:62ch;white-space:pre-wrap}
.letter p:last-child{margin-bottom:0}
.actions{margin:20px 0 0;display:flex;gap:10px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:30}
#toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="bar"></div>
<header class="top"><div class="row" id="head"></div></header>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== PASTE YOUR SUPABASE SETTINGS HERE (see setup steps) ===== */
var SUPABASE_URL = "https://pamhhnnnaxisvktlinbo.supabase.co";
var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBhbWhobm5uYXhpc3ZrdGxpbmJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1OTAwNDYsImV4cCI6MjEwOTE2NjA0Nn0.mRxim1JVqHZ8UDCvRy7w4p3ZvvBCU64bUoY_zgZZ-yI";
/* =============================================================== */
var root=document.documentElement, app=document.getElementById("app"), head=document.getElementById("head"), toastEl=document.getElementById("toast");
var mem={};
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){if(v===undefined)return mem[k]||null;mem[k]=v}}
function toast(m){toastEl.textContent=m;toastEl.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){toastEl.classList.remove("on")},2200)}
function el(tag,attrs,kids){var e=document.createElement(tag);for(var k in (attrs||{})){if(k==="text")e.textContent=attrs[k];else if(k.slice(0,2)==="on")e[k]=attrs[k];else e.setAttribute(k,attrs[k])}(kids||[]).forEach(function(c){e.appendChild(c)});return e}

var msgs=[], loaded=false, view="list", currentId=null, sb=null, vault=null;
var configured=SUPABASE_URL.indexOf("https")===0&&SUPABASE_KEY.indexOf("PASTE")!==0;
function fail(){toast("Couldn’t reach the online storage. Check your internet.")}
function dbSet(m){if(!sb)return;sb.rpc("save_message",{v:vault,m_id:m.id,m_title:m.title,m_body:m.body,m_fav:!!m.fav,m_created:m.created}).then(function(r){if(r.error)fail();else refresh()})}
function dbDel(id){if(!sb)return;sb.rpc("delete_message",{v:vault,m_id:id}).then(function(r){if(r.error)fail();else refresh()})}
function getPos(id){return parseFloat(store("pos_"+id))||0}
function newKey(){var c="abcdefghijkmnpqrstuvwxyz23456789",a=new Uint8Array(24);crypto.getRandomValues(a);return Array.prototype.map.call(a,function(n){return c[n%c.length]}).join("")}
function shareLink(){return location.origin+location.pathname+"#"+vault}
function refresh(){
  if(!sb||!vault)return;
  sb.rpc("list_messages",{v:vault}).then(function(r){
    if(r.error){if(!loaded)fail();return}
    msgs=(r.data||[]).map(function(x){return {id:x.id,title:x.title||"",body:x.body||"",fav:!!x.fav,created:Number(x.created)||0}});
    loaded=true;
    if(view==="list"&&document.getElementById("list"))draw();
    else if(view==="read"&&!msgs.some(function(m){return m.id===currentId}))showList();
  });
}
function connect(){
  refresh();
  setInterval(function(){if(!document.hidden&&view!=="form")refresh()},8000);
  addEventListener("focus",function(){if(view!=="form")refresh()});
}
var size=parseFloat(store("fs"))||1.15, filter="all", query="";
root.style.setProperty("--fs",size+"rem");

/* theme */
function dark(){var t=root.getAttribute("data-theme");return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches}
var st=store("theme");if(st)root.setAttribute("data-theme",st);
function themeBtn(){return el("button",{text:dark()?"Light mode":"Dark mode","aria-label":"Switch light or dark mode",onclick:function(){var n=dark()?"light":"dark";root.setAttribute("data-theme",n);store("theme",n);this.textContent=dark()?"Light mode":"Dark mode"}})}

function fmt(ts){return new Date(ts).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"})}
function setHead(nodes){head.textContent="";nodes.forEach(function(n){head.appendChild(n)})}
function sp(){return el("span",{"class":"sp"})}

/* ---------- LIST ---------- */
function showList(){
  view="list";window.scrollTo(0,0);
  setHead([el("span",{"class":"brand",text:"💜 My messages"}),sp(),el("button",{text:"Copy private link","aria-label":"Copy the private link to open these messages anywhere",onclick:function(){var l=shareLink();if(navigator.clipboard)navigator.clipboard.writeText(l).then(function(){toast("Link copied. Keep it private.")},function(){prompt("Copy this link",l)});else prompt("Copy this link",l)}}),themeBtn()]);
  app.textContent="";
  app.appendChild(el("h1",{text:"Messages from my love"}));
  app.appendChild(el("p",{"class":"sub",text:"Everything he’s written to me, saved in one place."}));
  app.appendChild(el("button",{"class":"main",text:"+ Add a message",onclick:function(){showForm()}}));
  if(msgs.length||!loaded){
    var s=el("input",{type:"search",placeholder:"Search your messages",value:query,"aria-label":"Search messages",style:"margin-top:16px"});
    s.oninput=function(){query=s.value;draw()};
    app.appendChild(s);
    var tabs=el("div",{"class":"tabs"});
    [["all","All"],["fav","♥ Favorites"]].forEach(function(t){tabs.appendChild(el("button",{text:t[1],"aria-pressed":filter===t[0],onclick:function(){filter=t[0];showList()}}))});
    app.appendChild(tabs);
  }
  app.appendChild(el("div",{id:"list"}));
  draw();
}
function draw(){
  var box=document.getElementById("list");box.textContent="";
  var q=query.toLowerCase();
  var items=msgs.filter(function(m){return (filter==="all"||m.fav)&&(!q||(m.title+" "+m.body).toLowerCase().indexOf(q)>-1)}).sort(function(a,b){return b.created-a.created});
  if(!loaded){box.appendChild(el("div",{"class":"empty"},[el("p",{text:"Loading your messages…"})]));return}
  if(!items.length){
    var e=el("div",{"class":"empty"});
    if(!msgs.length){e.appendChild(el("p",{text:"No messages saved yet. Tap “Add a message” and paste one in."}))}
    else e.appendChild(el("p",{text:filter==="fav"&&!q?"No favorites yet. Open a message and tap the heart.":"Nothing matches that search."}));
    box.appendChild(e);return;
  }
  items.forEach(function(m){
    var c=el("button",{"class":"card",onclick:function(){showRead(m.id)}},[
      el("h2",{},[el("span",{text:m.title||"Untitled message"}),el("span",{text:m.fav?"♥":"","aria-label":m.fav?"Favorite":""})]),
      el("div",{"class":"meta",text:"Saved "+fmt(m.created)}),
      el("div",{"class":"pre",text:m.body})
    ]);
    box.appendChild(c);
  });
}

/* ---------- ADD / EDIT ---------- */
function showForm(id){
  view="form";window.scrollTo(0,0);
  var m=msgs.filter(function(x){return x.id===id})[0];
  setHead([el("button",{text:"← Cancel",onclick:function(){m?showRead(id):showList()}}),sp(),themeBtn()]);
  app.textContent="";
  app.appendChild(el("h1",{text:m?"Edit message":"Add a message"}));
  app.appendChild(el("label",{"for":"t",text:"Title (optional)"}));
  var t=el("input",{type:"text",id:"t",placeholder:"For example: When you miss me",maxlength:"80"});t.value=m?m.title:"";
  app.appendChild(t);
  app.appendChild(el("label",{"for":"b",text:"Paste the message here"}));
  var b=el("textarea",{id:"b",placeholder:"Paste or type the whole message…"});b.value=m?m.body:"";
  app.appendChild(b);
  app.appendChild(el("div",{"class":"actions"},[el("button",{"class":"main",text:"Save message",onclick:function(){
    var body=b.value.trim();
    if(!body){toast("Paste a message first");b.focus();return}
    if(m){m.title=t.value.trim();m.body=body}
    else{id="m"+Date.now();m={id:id,title:t.value.trim(),body:body,fav:false,created:Date.now()};msgs.push(m)}
    dbSet(m);toast("Message saved");showRead(id);
  }})]));
  setTimeout(function(){(m?b:t).focus()},50);
}

/* ---------- READ ---------- */
function showRead(id){
  view="read";currentId=id;window.scrollTo(0,0);
  var m=msgs.filter(function(x){return x.id===id})[0];if(!m)return showList();
  function setSize(d){size=Math.max(.95,Math.min(1.8,size+d));root.style.setProperty("--fs",size+"rem");store("fs",size)}
  setHead([
    el("button",{text:"← All messages",onclick:showList}),sp(),
    el("button",{text:"A−","aria-label":"Smaller text",onclick:function(){setSize(-.1)}}),
    el("button",{text:"A+","aria-label":"Bigger text",onclick:function(){setSize(.1)}})
  ]);
  app.textContent="";
  app.appendChild(el("h1",{text:m.title||"Untitled message"}));
  app.appendChild(el("p",{"class":"sub",text:"Saved "+fmt(m.created)}));
  var L=el("article",{"class":"letter"});
  m.body.split(/\n\s*\n/).forEach(function(p){L.appendChild(el("p",{text:p.trim()}))});
  app.appendChild(L);
  var favBtn=el("button",{text:m.fav?"♥ Favorite":"♡ Add to favorites","aria-pressed":m.fav,onclick:function(){m.fav=!m.fav;dbSet(m);this.textContent=m.fav?"♥ Favorite":"♡ Add to favorites";this.setAttribute("aria-pressed",m.fav)}});
  var del=el("button",{"class":"danger",text:"Delete",onclick:function(){
    if(this.getAttribute("data-sure")){msgs=msgs.filter(function(x){return x.id!==id});dbDel(id);toast("Message deleted");showList()}
    else{this.setAttribute("data-sure","1");this.textContent="Tap again to delete";var b=this;setTimeout(function(){b.removeAttribute("data-sure");b.textContent="Delete"},3000)}
  }});
  var mark=el("button",{text:"Save my place",onclick:function(){var max=document.documentElement.scrollHeight-innerHeight;store("pos_"+id,max>0?scrollY/max:0);toast("Place saved");go.hidden=false}});
  var go=el("button",{text:"Go to my place",onclick:function(){var max=document.documentElement.scrollHeight-innerHeight;scrollTo({top:getPos(id)*max})}});go.hidden=!(getPos(id)>0);
  app.appendChild(el("div",{"class":"actions"},[
    el("button",{"class":"main",text:"Copy message",onclick:function(){
      function ok(){toast("Message copied")}
      function fb(){var a=document.createElement("textarea");a.value=m.body;document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){toast("Couldn’t copy. Select the text instead.")}a.remove()}
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(m.body).then(ok,fb);else fb();
    }}),
    favBtn,mark,go,
    el("button",{text:"Edit",onclick:function(){showForm(id)}}),
    del
  ]));
}

addEventListener("scroll",function(){var max=document.documentElement.scrollHeight-innerHeight;document.getElementById("bar").style.width=(max>0?scrollY/max*100:0)+"%"},{passive:true});
function showSetup(title,lines,btn){
  view="setup";setHead([el("span",{"class":"brand",text:"💜 My messages"}),sp(),themeBtn()]);app.textContent="";
  app.appendChild(el("h1",{text:title}));
  lines.forEach(function(l){app.appendChild(el("p",{"class":"sub",text:l}))});
  if(btn)app.appendChild(btn);
}
if(!configured){
  showSetup("Almost ready",["The online storage isn’t connected yet. Paste your Supabase settings into the file, then reload this page."]);
}else{
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  vault=(location.hash||"").replace("#","")||store("vault");
  if(vault&&vault.length>=20){store("vault",vault);if(location.hash!=="#"+vault)history.replaceState(null,"","#"+vault);connect();showList()}
  else showSetup("Start your private message box",["This creates a private link. Messages saved here are stored online, so you can open them from any phone with that link.","Send the link to the person who will keep the messages. Only people with the link can see them."],
    el("button",{"class":"main",text:"Create my private link",onclick:function(){vault=newKey();store("vault",vault);history.replaceState(null,"","#"+vault);connect();showList();toast("Tap “Copy private link” and send it")}}));
}
</script>
</body>
</html>
